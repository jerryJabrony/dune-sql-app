<!DOCTYPE html>
<html>
<head>
    <title>Dune SQL Translator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            color: #333;
        }
        .dune-btn {
            background: #1e1e2a;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .dune-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Dune SQL Translator</h1>
        <p>Превратите текстовый запрос в SQL и выполните в Dune Analytics</p>
        <button class="dune-btn" onclick="location.href='/auth/dune'">
            🔐 Авторизоваться через Dune
        </button>
    </div>
</body>
</html>
